<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>My Tasks</h1>
      <p id="date-label"></p>
    </div>

    <div class="input-row">
      <input
        class="task-input"
        id="task-input"
        type="text"
        placeholder="Add a new task…"
        maxlength="120"
      />
      <select class="priority-select" id="priority-select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button class="add-btn" id="add-btn">
        <i class="ti ti-plus"></i> Add
      </button>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-label">Done</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="stat-left">0</div>
        <div class="stat-label">Left</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
      <button class="filter-btn" data-filter="high">
        <i class="ti ti-flame"></i> High
      </button>
      <button class="filter-btn" data-filter="medium">Medium</button>
      <button class="filter-btn" data-filter="low">Low</button>
    </div>

    <div id="section-label" class="section-label">All tasks</div>
    <div class="todo-list" id="todo-list"></div>

    <div class="footer-row">
      <span class="footer-note" id="footer-note"></span>
      <button class="clear-btn" id="clear-btn">
        <i class="ti ti-trash"></i> Clear done
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
